<!doctype html>
<html manifest="psfree_lapse.cache">
<head><meta charset="utf-8"><title>JOKER • Installing Offline Cache</title>
<style>html,body{height:100%;margin:0}body{background:#050505 url("logo.jpg") center/cover no-repeat;color:#fff;font:26px Arial;display:flex;align-items:center;justify-content:center;text-align:center}#box{padding:35px 55px;background:rgba(0,0,0,.78);border:2px solid #ffcc00;border-radius:24px}#msgs{color:#ffcc00;font-weight:800}</style>
<script>
function DLProgress(e){if(e.lengthComputable)msgs.innerHTML="جاري حفظ JOKER Host أوفلاين... "+Math.round(e.loaded/e.total*100)+"%";}
function done(){msgs.innerHTML="تم حفظ JOKER Host بنجاح ✓";setTimeout(()=>location.reload(),1800);}
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=done;window.applicationCache.onupdateready=done;
</script></head><body><div id="box"><div>🃏 JOKER HOST</div><div id="msgs">جاري تثبيت الملفات...</div></div></body></html>
