<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <style>
        body {
            background-color: #0b0b0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #14141c;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7);
            border: 1px solid #2a2a3d;
        }
        .logo {
            width: 100%;
            max-height: 280px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #ffcc00;
            margin-bottom: 20px;
        }
        h1 {
            color: #0070d1;
            margin-bottom: 5px;
            font-size: 26px;
        }
        .subtitle {
            color: #ffcc00;
            font-size: 16px;
            margin-bottom: 25px;
            font-weight: bold;
        }
        .btn {
            display: block;
            width: 85%;
            margin: 15px auto;
            padding: 18px;
            background: linear-gradient(135deg, #0070d1, #00438a);
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 112, 209, 0.4);
            transition: 0.3s;
        }
        .btn:hover {
            background: linear-gradient(135deg, #005bb5, #003366);
        }
        .note {
            color: #b0b0b0;
            margin-top: 25px;
            font-size: 13px;
            border-top: 1px solid #2a2a3d;
            padding-top: 15px;
            line-height: 1.6;
        }

    <div class="container">
