<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JOKER PS4</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030207}
body{display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;color:#fff}
.bg{position:fixed;inset:0;background:url("joker-logo.png") center/cover no-repeat;filter:brightness(.28) saturate(1.25)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.62)}
.box{position:relative;z-index:2;width:min(90vw,520px);padding:20px;text-align:center;border:1px solid rgba(255,210,60,.5);border-radius:24px;background:rgba(7,4,15,.76);backdrop-filter:blur(8px);box-shadow:0 0 40px rgba(90,0,255,.35)}
.logo{width:100%;max-height:300px;object-fit:contain;border-radius:16px}
h1{margin:12px 0 5px;font-size:clamp(28px,7vw,42px)}
p{margin:0;color:#ddd}
.status{margin-top:18px;color:#ffd83d;font-weight:bold}
.spinner{width:28px;height:28px;border:3px solid rgba(255,255,255,.2);border-top-color:#ffd83d;border-radius:50%;margin:15px auto 0;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="bg"></div><div class="overlay"></div>
<div class="box">
  <img class="logo" src="joker-logo.png" alt="JOKER">
  <h1>JOKER PS4</h1>
  <p>جاري تشغيل الـ PS4 Host...</p>
  <div class="status">بدء التشغيل تلقائياً</div>
  <div class="spinner"></div>
</div>

<script>
/*
  يتم التحويل تلقائياً بدون أي زر.
  هذا يحافظ على الـHost الحالي الذي كنت تستخدمه.
*/
window.addEventListener("load", function () {
  setTimeout(function () {
    window.location.replace("https://gamerhack.github.io/900v3/");
  }, 1200);
});
</script>
</body>
</html>
